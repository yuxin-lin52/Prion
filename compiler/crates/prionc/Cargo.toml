[package]
name = "prionc"
version.workspace = true
edition.workspace = true

[features]
# 缺省 = 完整编译器（前端 + 两个后端）
default = ["backend", "llvm"]
# 代码生成（到 IR 层）；关掉则只到检查层
backend = ["dep:prion-ir", "dep:prion-lower", "dep:prion-walk", "dep:prion-opt"]
# LLVM 后端；关掉则不需要 LLVM 22.1 SDK
llvm = ["dep:prion-llvm", "backend"]

[dependencies]
prion-error = { path = "../prion-error" }
prion-lexer = { path = "../prion-lexer" }
prion-parser = { path = "../prion-parser" }
prion-check = { path = "../prion-check" }
prion-ir = { path = "../prion-ir", optional = true }
prion-lower = { path = "../prion-lower", optional = true }
prion-walk = { path = "../prion-walk", optional = true }
prion-opt = { path = "../prion-opt", optional = true }
prion-llvm = { path = "../prion-llvm", optional = true }
serde_json = "1"
