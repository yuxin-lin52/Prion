[package]
name = "argonc"
version.workspace = true
edition.workspace = true

[features]
# 缺省 = 完整编译器（前端 + 两个后端）
default = ["backend", "llvm"]
# 代码生成（C 后端）；关掉则只到检查层
backend = ["dep:argon-ir", "dep:argon-lower", "dep:argon-walk", "dep:argon-opt", "dep:argon-codegen"]
# LLVM 后端；关掉则不需要 LLVM 22.1 SDK
llvm = ["dep:argon-llvm", "backend"]

[dependencies]
argon-error = { path = "../argon-error" }
argon-lexer = { path = "../argon-lexer" }
argon-parser = { path = "../argon-parser" }
argon-check = { path = "../argon-check" }
argon-ir = { path = "../argon-ir", optional = true }
argon-lower = { path = "../argon-lower", optional = true }
argon-walk = { path = "../argon-walk", optional = true }
argon-opt = { path = "../argon-opt", optional = true }
argon-codegen = { path = "../argon-codegen", optional = true }
argon-llvm = { path = "../argon-llvm", optional = true }
serde_json = "1"
