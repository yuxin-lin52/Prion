name: build

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "compiler/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Account age gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check the age of the pull request author
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          created=$(gh api "users/$LOGIN" --jq .created_at)
          age=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
          echo "$LOGIN registered on $created, $age days ago"
          if [ "$age" -lt 365 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The author account is younger than 365 days, so the check does not run on its own. A maintainer can start it by hand."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the compiler
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          cargo --version
          rustc --version

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libzstd-dev libxml2-dev
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          llvm-config-22 --version
          clang-22 --version

      - name: Build the compiler
        working-directory: compiler
        env:
          LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
          RUSTFLAGS: -L native=/usr/lib/llvm-22/lib
        run: cargo build --release -p prionc

      - name: Smoke test
        env:
          PRION_CC: /usr/bin/clang-22
        run: |
          set -e
          exe="$PWD/compiler/target/release/prionc"
          "$exe" -V
          mkdir -p "$RUNNER_TEMP/smoke"
          cat > "$RUNNER_TEMP/smoke/hello.an" <<'EOF'
          #: main b
              print("ok")
          #: main d
          EOF
          cd "$RUNNER_TEMP/smoke"
          out=$("$exe" run hello)
          echo "$out"
          test "$out" = "ok"
          echo "the smoke test produced the expected output"
